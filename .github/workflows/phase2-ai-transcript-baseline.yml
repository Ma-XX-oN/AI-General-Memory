name: Phase 2 AI-transcript baseline

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase2-ai-transcript-baseline.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run current production formatter against Phase 2 fixtures
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SCRIPT_BLOB_SHA="$(git hash-object scripts/AI-transcript.py)"
          OUT='scripts/phase2-baseline-output'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python -m py_compile scripts/AI-transcript.py

          run_case() {
            local name="$1"
            shift
            set +e
            "$@" > "$OUT/$name.md" 2> "$OUT/$name.stderr.txt"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/$name.exit-code.txt"
          }

          run_case chatgpt-metadata-sandbox \
            python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-metadata-sandbox.jsonl
          run_case chatgpt-chronological-duplicate-identity \
            python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl
          run_case codex-orphan-patch \
            python scripts/AI-transcript.py --codex --file scripts/fixtures/codex-orphan-patch.jsonl
          run_case claude-adaptive-fence \
            python scripts/AI-transcript.py --claude --file scripts/fixtures/adaptive-fence.jsonl

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('scripts/phase2-baseline-output')
          names = [
            'chatgpt-metadata-sandbox',
            'chatgpt-chronological-duplicate-identity',
            'codex-orphan-patch',
            'claude-adaptive-fence',
          ]
          commands = {
            'chatgpt-metadata-sandbox': 'python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-metadata-sandbox.jsonl',
            'chatgpt-chronological-duplicate-identity': 'python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl',
            'codex-orphan-patch': 'python scripts/AI-transcript.py --codex --file scripts/fixtures/codex-orphan-patch.jsonl',
            'claude-adaptive-fence': 'python scripts/AI-transcript.py --claude --file scripts/fixtures/adaptive-fence.jsonl',
          }
          cases = {}
          for name in names:
            cases[name] = {
              'command': commands[name],
              'exit_code': int((out / f'{name}.exit-code.txt').read_text().strip()),
              'stdout_path': f'{name}.md',
              'stderr_path': f'{name}.stderr.txt',
            }
          metadata = {
            'schema_version': 1,
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'source_commit': os.environ['SOURCE_COMMIT'],
            'script_path': 'scripts/AI-transcript.py',
            'script_blob_sha': os.environ['SCRIPT_BLOB_SHA'],
            'cases': cases,
          }
          (out / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY

          git add -f "$OUT"
          git commit -m 'Capture current AI-transcript Phase 2 baselines [skip ci]'
          git push origin master

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin master
          if [[ -f .github/workflows/phase2-ai-transcript-baseline.yml ]]; then
            git rm .github/workflows/phase2-ai-transcript-baseline.yml
            git commit -m 'Remove temporary Phase 2 baseline workflow [skip ci]'
            git push origin master
          fi

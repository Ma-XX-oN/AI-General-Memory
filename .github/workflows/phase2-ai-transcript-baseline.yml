name: Phase 2 AI-transcript baseline

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/phase2-ai-transcript-baseline.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run current production formatter against Phase 2 fixtures
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SCRIPT_BLOB_SHA="$(git hash-object scripts/AI-transcript.py)"
          OUT='scripts/phase2-baseline-output'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python -m py_compile scripts/AI-transcript.py

          python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-metadata-sandbox.jsonl \
            > "$OUT/chatgpt-metadata-sandbox.md" 2> "$OUT/chatgpt-metadata-sandbox.stderr.txt"
          python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl \
            > "$OUT/chatgpt-chronological-duplicate-identity.md" 2> "$OUT/chatgpt-chronological-duplicate-identity.stderr.txt"
          python scripts/AI-transcript.py --codex --file scripts/fixtures/codex-orphan-patch.jsonl \
            > "$OUT/codex-orphan-patch.md" 2> "$OUT/codex-orphan-patch.stderr.txt"
          python scripts/AI-transcript.py --claude --file scripts/fixtures/adaptive-fence.jsonl \
            > "$OUT/claude-adaptive-fence.md" 2> "$OUT/claude-adaptive-fence.stderr.txt"

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path('scripts/phase2-baseline-output')
          metadata = {
            'schema_version': 1,
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'source_commit': os.environ['SOURCE_COMMIT'],
            'script_path': 'scripts/AI-transcript.py',
            'script_blob_sha': os.environ['SCRIPT_BLOB_SHA'],
            'commands': {
              'chatgpt-metadata-sandbox.md': 'python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-metadata-sandbox.jsonl',
              'chatgpt-chronological-duplicate-identity.md': 'python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl',
              'codex-orphan-patch.md': 'python scripts/AI-transcript.py --codex --file scripts/fixtures/codex-orphan-patch.jsonl',
              'claude-adaptive-fence.md': 'python scripts/AI-transcript.py --claude --file scripts/fixtures/adaptive-fence.jsonl'
            }
          }
          (out / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY

          git add "$OUT"
          git diff --cached --check
          git commit -m 'Capture current AI-transcript Phase 2 baselines [skip ci]'
          git push origin master

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin master
          git rm .github/workflows/phase2-ai-transcript-baseline.yml
          git commit -m 'Remove temporary Phase 2 baseline workflow [skip ci]'
          git push origin master

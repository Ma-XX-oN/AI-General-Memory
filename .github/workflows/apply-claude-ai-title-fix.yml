name: Apply Claude ai-title precedence fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-claude-ai-title-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Apply root-cause fix and verify
        shell: bash
        env:
          REPLACEMENT_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("scripts/AI-transcript.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _cl_session_meta(path):\n")
          end = text.index("\ndef _cl_session_grep(", start)
          replacement = base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8")
          path.write_text(text[:start] + replacement + text[end + 1:], encoding="utf-8")
          PY
          AI_CONVERSATION_CORE="$PWD/dependencies/AIConversationCore" \
            python scripts/test-AI-transcript-leading-system-context.py
          python -m py_compile scripts/AI-transcript.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/AI-transcript.py
          git commit -m "fix: prefer Claude ai-title session metadata"
          git push origin HEAD:master

# Root-fix applier; remove after successful commit.
name: Apply Claude title root-cause fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-claude-title-root-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Apply root-cause fix and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/AI-transcript.py")
          text = path.read_text(encoding="utf-8")

          old_user = (
            '              text = _cl_strip_system(block.get("text", ""))\n'
            '              if text:\n'
            '                title = text[:80]\n'
            '                break\n'
          )
          new_user = (
            '              text = _cl_strip_system(block.get("text", ""))\n'
            '              first_line = next(\n'
            '                (line.strip() for line in text.splitlines() if line.strip()),\n'
            '                "",\n'
            '              )\n'
            '              if first_line:\n'
            '                title = first_line[:80]\n'
            '                break\n'
          )
          if text.count(old_user) != 1:
            raise SystemExit(
              f"expected exactly one Claude user-title producer, found {text.count(old_user)}"
            )
          text = text.replace(old_user, new_user, 1)

          old_fallback = (
            '                  text = block.get("text", "").strip()\n'
            '                  if text:\n'
            '                    asst_fallback = text[:80]\n'
            '                    break\n'
          )
          new_fallback = (
            '                  text = block.get("text", "").strip()\n'
            '                  first_line = next(\n'
            '                    (line.strip() for line in text.splitlines() if line.strip()),\n'
            '                    "",\n'
            '                  )\n'
            '                  if first_line:\n'
            '                    asst_fallback = first_line[:80]\n'
            '                    break\n'
          )
          if text.count(old_fallback) != 1:
            raise SystemExit(
              f"expected exactly one Claude assistant-title fallback, found {text.count(old_fallback)}"
            )
          text = text.replace(old_fallback, new_fallback, 1)

          old_formatter = (
            '  title = next(\n'
            '    (line.strip() for line in session.title.splitlines() if line.strip()),\n'
            '    "(no title)",\n'
            '  )\n'
            '  line2 = _ansi(f"({session.id[:8]}) {title}", _C_TITLE, active=render_color)\n'
          )
          new_formatter = (
            '  assert "\\n" not in session.title and "\\r" not in session.title\n'
            '  line2 = _ansi(\n'
            '    f"({session.id[:8]}) {session.title}", _C_TITLE, active=render_color\n'
            '  )\n'
          )
          if text.count(old_formatter) != 1:
            raise SystemExit(
              f"expected exactly one output-boundary containment block, found {text.count(old_formatter)}"
            )
          text = text.replace(old_formatter, new_formatter, 1)

          path.write_text(text, encoding="utf-8")
          PY
          AI_CONVERSATION_CORE="$PWD/dependencies/AIConversationCore" \
            python scripts/test-AI-transcript-leading-system-context.py
          python -m py_compile scripts/AI-transcript.py
          git diff --check
      - name: Commit root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/AI-transcript.py
          git commit -m "fix: normalize Claude session title at source"
          git push origin HEAD:master

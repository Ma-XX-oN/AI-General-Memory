name: Apply issue 10 Core-owned heading metadata

on:
  push:
    branches:
      - issue-10-core-owned-heading-metadata
    paths:
      - '.github/workflows/issue10-core-owned-heading.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: b7961cb8dab11611a5af8f4304ae783295998cf2
          path: .issue10-core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AIConversationCore dependencies
        working-directory: .issue10-core
        run: npm ci
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Apply Core-owned heading migration
        run: |
          python scripts/issue10-core-owned-heading.py
          python scripts/issue10-core-dependency-install.py
      - name: Python syntax gate
        run: python -m py_compile scripts/AI-transcript.py scripts/test-AI-transcript-phase6-parity.py scripts/test-AI-transcript-core-parity.py scripts/test-AI-transcript-turn-id.py
      - name: Materialize historical baseline
        run: git show abcc2f33783e3690b9e1335161c73e7dabaed757:scripts/AI-transcript.py > /tmp/AI-transcript-legacy.py
      - name: Historical presentation parity
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.issue10-core
          LEGACY_AI_TRANSCRIPT: /tmp/AI-transcript-legacy.py
        run: python scripts/test-AI-transcript-phase6-parity.py
      - name: Canonical production parity
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.issue10-core
        run: python scripts/test-AI-transcript-core-parity.py
      - name: Turn ID and Core-owned heading metadata
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.issue10-core
        run: python scripts/test-AI-transcript-turn-id.py
      - name: Portable regression subset
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.issue10-core
          TERM: xterm
        run: bash scripts/AI-transcript-tests.sh $(seq -s ' ' 69 105)
      - name: Core regression suite
        working-directory: .issue10-core
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit production change and remove temporary scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue10-core-owned-heading.yml scripts/issue10-core-owned-heading.py scripts/issue10-core-dependency-install.py
          git rm .github/workflows/issue-10-turn-id.yml .github/workflows/issue-10-product-commit.yml
          git add scripts/AI-transcript.py scripts/AI-transcript-core-worker.mjs scripts/AI-transcript-core.md scripts/test-AI-transcript-turn-id.py scripts/test-AI-transcript-phase6-parity.py .github/workflows/ai-transcript-core-parity.yml
          git commit -m 'transcript: consume Core-owned heading metadata (#10)'
          git push

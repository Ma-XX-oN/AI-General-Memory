name: Correct AI-transcript debug help once

on:
  push:
    paths:
      - .github/workflows/ai-transcript-help-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Correct -N help text
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('scripts/AI-transcript.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
            r'(  ap\.add_argument\(\n    "-N",\n    action="store_true", dest="debug_record_comment",\n    help=\(\n)'
            r'      "In transcript mode: emit a \'<!-- record: N -->\' comment before each "\n'
            r'      "visible record block for debugging\."\n'
            r'(    \),\n  \))'
          )
          replacement = (
            r'\1'
            '      "In transcript mode: emit canonical source provenance using turn_id "\n'
            '      "and zero-based record_index comments on renderer-generated "\n'
            '      "headings/groupings for debugging."\n'
            r'\2'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'expected one legacy -N help block, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax and diff hygiene
        run: |
          python -m py_compile scripts/AI-transcript.py
          git diff --check
      - name: Commit corrected help and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-transcript-help-once.yml
          git add scripts/AI-transcript.py
          git commit -m "phase6: describe canonical debug provenance in CLI help"
          git push

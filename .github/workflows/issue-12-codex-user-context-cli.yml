name: Issue 12 Codex user-context CLI acceptance

on:
  push:
    branches:
      - issue-12-codex-user-context-cli

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Run real CLI acceptance regression
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/dependencies/AIConversationCore
        run: python scripts/test-AI-transcript-codex-user-context-cli.py

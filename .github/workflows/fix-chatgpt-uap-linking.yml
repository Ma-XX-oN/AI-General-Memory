name: Apply ChatGPT UAP identity fix
on:
  push:
    branches: [master]
    paths: ['.github/workflows/fix-chatgpt-uap-linking.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fix_chatgpt_uap.py
      - run: |
          python3 -m py_compile scripts/AI-transcript.py
          python3 scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-direct.jsonl >/tmp/chatgpt.md
          grep -q 'Find the screenshot-backed tool output and final answer' /tmp/chatgpt.md
      - run: |
          rm .github/workflows/fix-chatgpt-uap-linking.yml .github/fix_chatgpt_uap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/AI-transcript.py .github/workflows/fix-chatgpt-uap-linking.yml .github/fix_chatgpt_uap.py
          git commit -m 'fix: group ChatGPT transcript records by UAP identity [skip ci]'
          git push
name: Temporary #106 corrected AIGM Core compatibility

on:
  push:
    branches:
      - tmp/issue-106-core-compat-corrected

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable corrected AIGM repin
        uses: actions/checkout@v4
        with:
          ref: 21c7c9823aa7d5658fa7490c5a0ff8724369198b
          fetch-depth: 0
          submodules: recursive

      - name: Assert exact AIGM and Core candidates
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "21c7c9823aa7d5658fa7490c5a0ff8724369198b"
          test "$(git rev-parse HEAD:dependencies/AIConversationCore)" = "6269168cee1f0b49f8d535d4e71ba0acbd232547"
          test "$(git -C dependencies/AIConversationCore rev-parse HEAD)" = "6269168cee1f0b49f8d535d4e71ba0acbd232547"
          grep -F "const CORE_COMMIT = '6269168cee1f0b49f8d535d4e71ba0acbd232547';" scripts/AI-transcript-core-worker.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Core Node dependencies
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run authoritative AIGM validation wrapper
        run: python scripts/repoworkflow_validate.py

name: Apply session title boundary fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-session-title-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Apply and verify title-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/AI-transcript.py")
          text = path.read_text(encoding="utf-8")
          old = '  line2 = _ansi(f"({session.id[:8]}) {session.title}", _C_TITLE, active=render_color)\n'
          new = (
            '  title = next(\n'
            '    (line.strip() for line in session.title.splitlines() if line.strip()),\n'
            '    "(no title)",\n'
            '  )\n'
            '  line2 = _ansi(f"({session.id[:8]}) {title}", _C_TITLE, active=render_color)\n'
          )
          if text.count(old) != 1:
            raise SystemExit(f"expected exactly one title-header assignment, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          AI_CONVERSATION_CORE="$PWD/dependencies/AIConversationCore" \
            python scripts/test-AI-transcript-leading-system-context.py
          python -m py_compile scripts/AI-transcript.py
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/AI-transcript.py
          git commit -m "fix: keep transcript session title on one line"
          git push origin HEAD:master

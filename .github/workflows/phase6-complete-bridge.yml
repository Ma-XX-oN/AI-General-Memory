name: Complete Phase 6 canonical bridge

on:
  push:
    paths:
      - .github/workflows/phase6-complete-bridge.yml
      - scripts/AI-transcript-core-worker.mjs
      - scripts/apply-phase6-complete-bridge.py
      - scripts/test-AI-transcript-phase6-parity.py
      - scripts/test-AI-transcript-core-parity.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AI-General-Memory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pinned AIConversationCore
        uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/AIConversationCore
          ref: f84fd1a2394f9990898448c826f1812076baff03
          path: .phase6-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install presentation dependencies
        run: python -m pip install colorama regex
      - name: Materialize pre-Phase-6 production baseline
        run: git show abcc2f33783e3690b9e1335161c73e7dabaed757:scripts/AI-transcript.py > /tmp/AI-transcript-legacy.py
      - name: Apply complete production bridge
        run: python scripts/apply-phase6-complete-bridge.py
      - name: Python syntax gate
        run: python -m py_compile scripts/AI-transcript.py scripts/test-AI-transcript-phase6-parity.py scripts/test-AI-transcript-core-parity.py scripts/apply-phase6-complete-bridge.py
      - name: Pre-migration presentation parity
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.phase6-core
          LEGACY_AI_TRANSCRIPT: /tmp/AI-transcript-legacy.py
        run: python scripts/test-AI-transcript-phase6-parity.py
      - name: Canonical production parity
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.phase6-core
        run: python scripts/test-AI-transcript-core-parity.py
      - name: Diagnose legacy fixture assertions
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.phase6-core
        run: |
          echo '=== thinking-lt-escape ==='
          python scripts/AI-transcript.py --claude --file scripts/fixtures/thinking-lt-escape.jsonl --color never
          echo '=== exit-plan-mode ==='
          python scripts/AI-transcript.py --claude --file scripts/fixtures/exit-plan-mode.jsonl --color never
          echo '=== chatgpt favicon excerpt ==='
          python scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-direct.jsonl --color never | grep -oE 'https?[^" )]+' | grep -E 'favicon|python' || true
      - name: Existing AI-transcript regression suite
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}/.phase6-core
        run: bash scripts/AI-transcript-tests.sh
      - name: Core regression suite
        working-directory: .phase6-core
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified production migration
        run: |
          rm -rf .phase6-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/AI-transcript.py
          git commit -m "phase6: route all transcript presentation through AIConversationCore"
          git push

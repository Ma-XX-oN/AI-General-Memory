name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.request.outputs.run_ci }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      prepare_context: ${{ steps.prepare-context.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce repository automation policy
        run: python RepoWorkflow/repo_workflow.py repository-policy
      - name: Enforce branch policy
        run: >-
          python RepoWorkflow/repo_workflow.py branch-policy
          --branch "${{ github.head_ref || github.ref_name }}"
          --pr-base "${{ github.base_ref }}"
      - name: Detect explicit remote CI request
        id: request
        shell: bash
        run: >-
          echo "run_ci=$(python RepoWorkflow/repo_workflow.py github-request
          --event-name '${{ github.event_name }}'
          --event-path "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"
      - name: Resolve artifact-preparation context
        id: prepare-context
        shell: bash
        run: >-
          echo "context=$(python RepoWorkflow/repo_workflow.py github-prepare-context)"
          >> "$GITHUB_OUTPUT"
      - name: Load GitHub validation matrix
        if: steps.request.outputs.run_ci == 'true'
        id: matrix
        shell: bash
        run: >-
          echo "matrix=$(python RepoWorkflow/repo_workflow.py github-matrix)"
          >> "$GITHUB_OUTPUT"

  prepare:
    needs: policy
    if: needs.policy.outputs.run_ci == 'true'
    runs-on: ${{ fromJSON(needs.policy.outputs.prepare_context).runner }}
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.prepare.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ fromJSON(needs.policy.outputs.prepare_context).pythonVersion }}
      - uses: actions/setup-node@v4
        if: fromJSON(needs.policy.outputs.prepare_context).nodeVersion != ''
        with:
          node-version: ${{ fromJSON(needs.policy.outputs.prepare_context).nodeVersion }}
      - name: Verify requested candidate
        run: >-
          python RepoWorkflow/repo_workflow.py preflight
          --expected-sha "${{ github.sha }}"
      - name: Configure generated-artifact commit identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Materialize declared committed artifacts
        id: prepare
        shell: bash
        run: |
          before="$(git rev-parse HEAD)"
          mkdir -p "${{ runner.temp }}/repoworkflow-result"
          set +e
          python RepoWorkflow/repo_workflow.py materialize-artifacts \
            --commit \
            --result "${{ runner.temp }}/repoworkflow-result/artifacts.json"
          materialize_rc=$?
          set -e
          after="$(git rev-parse HEAD)"
          if [ "$materialize_rc" -eq 0 ] && [ "$after" != "$before" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "tested_sha=$after" >> "$GITHUB_OUTPUT"
      - name: Upload structured artifact-preparation result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: repoworkflow-result-artifacts
          path: ${{ runner.temp }}/repoworkflow-result/artifacts.json
          if-no-files-found: error

  validate:
    needs:
      - policy
      - prepare
    if: needs.policy.outputs.run_ci == 'true' && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pythonVersion }}
      - uses: actions/setup-node@v4
        if: matrix.nodeVersion != ''
        with:
          node-version: ${{ matrix.nodeVersion }}
      - name: Run repository-owned validation entry point
        id: validation
        continue-on-error: true
        run: >-
          python RepoWorkflow/repo_workflow.py run
          --environment "${{ matrix.id }}"
          --expected-sha "${{ needs.prepare.outputs.tested_sha }}"
          --result "${{ runner.temp }}/repoworkflow-result/${{ matrix.id }}.json"
      - name: Upload structured environment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repoworkflow-result-${{ matrix.id }}
          path: ${{ runner.temp }}/repoworkflow-result/${{ matrix.id }}.json
          if-no-files-found: error

  finalize:
    needs:
      - policy
      - prepare
      - validate
    if: always() && needs.policy.outputs.run_ci == 'true' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tested_sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare result collection directory
        shell: bash
        run: mkdir -p "${{ runner.temp }}/repoworkflow-results"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: repoworkflow-result-*
          path: ${{ runner.temp }}/repoworkflow-results
          merge-multiple: true
      - name: Configure result-tag identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Finalize authoritative result
        run: >-
          python RepoWorkflow/repo_workflow.py finalize
          --results-dir "${{ runner.temp }}/repoworkflow-results"
          --expected-sha "${{ needs.prepare.outputs.tested_sha }}"
          --tag --push

name: Repair ChatGPT transcript renderer
on:
  push:
    branches: [master]
    paths: ['.github/workflows/repair-chatgpt-transcript.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore chronological ChatGPT rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/AI-transcript.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _cg_order_records_by_uap(records):')
          end = text.index('class ChatGPTSessionStore(SessionStore):', start)
          text = text[:start] + text[end:]
          call_block = '''    for idx, rec in enumerate(lines):\n      rec.setdefault("_rec_no", idx + 1)\n    lines = _cg_order_records_by_uap(lines)\n\n'''
          assert text.count(call_block) == 1
          text = text.replace(call_block, '', 1)
          assert '_cg_order_records_by_uap' not in text
          path.write_text(text, encoding='utf-8')

          tests = Path('scripts/AI-transcript-tests.sh')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'check "chatgpt-direct: grep finds tool output"'
          line_start = test_text.index(marker)
          line_end = test_text.index('\n', line_start) + 1
          check = 'check "chatgpt-direct: duplicate identity stays chronological" 0 \'Second answer\' "" $SCRIPT --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl\n'
          if 'duplicate identity stays chronological' not in test_text:
            test_text = test_text[:line_end] + check + test_text[line_end:]
          tests.write_text(test_text, encoding='utf-8')
          PY
          cat > scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl <<'EOF'
          {"id":"u1","author":{"role":"user"},"content":{"content_type":"text","parts":["First question"]},"metadata":{"turn_exchange_id":"same-exchange","working_turn_id":"same-working"}}
          {"id":"a1","author":{"role":"assistant"},"channel":"final","content":{"content_type":"text","parts":["First answer"]},"metadata":{"turn_exchange_id":"same-exchange","working_turn_id":"same-working"}}
          {"id":"u2","author":{"role":"user"},"content":{"content_type":"text","parts":["Second question"]},"metadata":{"turn_exchange_id":"same-exchange","working_turn_id":"same-working"}}
          {"id":"a2","author":{"role":"assistant"},"channel":"final","content":{"content_type":"text","parts":["Second answer"]},"metadata":{"turn_exchange_id":"same-exchange","working_turn_id":"same-working"}}
          EOF
          python3 -m py_compile scripts/AI-transcript.py
          python3 scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl > /tmp/chatgpt-order.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/chatgpt-order.txt').read_text(encoding='utf-8')
          positions = [text.index(x) for x in ['First question', 'First answer', 'Second question', 'Second answer']]
          assert positions == sorted(positions), positions
          PY
          python3 scripts/AI-transcript.py --chatgpt --file scripts/fixtures/chatgpt-direct.jsonl > /tmp/chatgpt-render.txt
          grep -q 'Find the screenshot-backed tool output and final answer.' /tmp/chatgpt-render.txt
          grep -q '\[image missing\]' /tmp/chatgpt-render.txt
          grep -q '(cite:' /tmp/chatgpt-render.txt
          grep -q 'AI-transcript.py L1-L2' /tmp/chatgpt-render.txt
          grep -q '(memory:' /tmp/chatgpt-render.txt
          ! grep -q 'filecite' /tmp/chatgpt-render.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/AI-transcript.py scripts/AI-transcript-tests.sh scripts/fixtures/chatgpt-chronological-duplicate-identity.jsonl
          git commit -m 'fix: restore chronological ChatGPT transcript rendering [skip ci]'
          git push origin master
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-chatgpt-transcript.yml
          git commit -m 'Remove temporary AI-transcript repair workflow [skip ci]'
          git push origin master

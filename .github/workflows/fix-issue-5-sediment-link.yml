name: Fix issue 5 sediment link

on:
  push:
    branches:
      - issue-5-sediment-download-link-temp

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sediment image links
        run: |
          git fetch origin master
          git checkout master
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/AI-transcript.py')
          text = path.read_text(encoding='utf-8')
          old = '''  parsed = urllib.parse.urlparse(source)\n  if parsed.scheme not in ("http", "https"):\n    return f"[image not available]({source})"\n'''
          new = '''  if source.startswith("sediment://"):\n    asset_id = source[len("sediment://"):].split("?", 1)[0].split("#", 1)[0]\n    if asset_id.startswith("file_"):\n      encoded_id = urllib.parse.quote(asset_id, safe="")\n      download_url = f"https://chatgpt.com/backend-api/files/download/{encoded_id}"\n      return (\n        f"[image not available]({download_url}) "\n        f"<!-- source: {source} -->"\n      )\n\n  parsed = urllib.parse.urlparse(source)\n  if parsed.scheme not in ("http", "https"):\n    return f"[image not available]({source})"\n'''
          if old not in text:
            raise SystemExit('sediment patch target not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/AI-transcript.py
          python - <<'PY'
          import runpy
          ns = runpy.run_path('scripts/AI-transcript.py', run_name='ai_transcript_test')
          render = ns['_cg_image_pointer_markdown']
          source = 'sediment://file_0000000000d081f5a5dbdf09c79c58aa'
          got = render({'content_type': 'image_asset_pointer', 'asset_pointer': source})
          expected = '[image not available](https://chatgpt.com/backend-api/files/download/file_0000000000d081f5a5dbdf09c79c58aa) <!-- source: sediment://file_0000000000d081f5a5dbdf09c79c58aa -->'
          assert got == expected, (got, expected)
          assert render({'content_type': 'image_asset_pointer', 'asset_pointer': 'sediment://legacy-pointer'}) == '[image not available](sediment://legacy-pointer)'
          PY
          git diff --check
          git add scripts/AI-transcript.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: map ChatGPT sediment file pointers [skip ci]'
          git push origin master

name: Apply tracked Codex source ownership integration

on:
  push:
    paths:
      - .github/workflows/apply-codex-source-ownership.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Advance pinned core and apply bounded consumer changes
        shell: bash
        env:
          CORE_COMMIT: 4ee65bab8f6a4c2f9caf55f2ff342d903108f8de
        run: |
          set -euo pipefail
          git -C dependencies/AIConversationCore fetch origin "$CORE_COMMIT"
          git -C dependencies/AIConversationCore checkout --detach "$CORE_COMMIT"

          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/AI-transcript.py')
          text = script.read_text(encoding='utf-8')

          old = '''  def render(self, provider, records, source_indexes, projections, *,\n             options=None, session_index_records=None):\n    """Render canonical Markdown and metadata for one provider record sequence."""\n    response = self.request({\n      "operation": "render",\n      "provider": provider,\n      "records": records,\n      "source_indexes": source_indexes,\n      "projections": projections,\n      "options": options or {},\n      "session_index_records": session_index_records or [],\n    })\n    return response\n'''
          new = '''  def render(self, provider, records, source_indexes, projections, *,\n             options=None, supplementary_sources=None):\n    """Render canonical Markdown and metadata for one provider record sequence."""\n    response = self.request({\n      "operation": "render",\n      "provider": provider,\n      "records": records,\n      "source_indexes": source_indexes,\n      "projections": projections,\n      "options": options or {},\n      "supplementary_sources": supplementary_sources or {},\n    })\n    return response\n'''
          if text.count(old) != 1:
            raise SystemExit('bridge render signature block did not match exactly once')
          text = text.replace(old, new, 1)

          old = '''def _codex_session_index_records():\n  """Return caller-discovered Codex session-index records when available."""\n  codex_home = os.environ.get("CODEX_HOME")\n  if not codex_home:\n    codex_home = os.path.join(os.path.expanduser("~"), ".codex")\n  index_path = os.path.join(codex_home, "session_index.jsonl")\n  records = []\n  try:\n    with open(index_path, encoding="utf-8") as source:\n      for raw in source:\n        raw = raw.strip()\n        if raw:\n          records.append(json.loads(raw))\n  except (OSError, json.JSONDecodeError):\n    return []\n  return records\n'''
          new = '''def _codex_session_index_path():\n  """Return the caller-discovered Codex session-index path when available."""\n  codex_home = os.environ.get("CODEX_HOME")\n  if not codex_home:\n    codex_home = os.path.join(os.path.expanduser("~"), ".codex")\n  index_path = os.path.join(codex_home, "session_index.jsonl")\n  return index_path if os.path.isfile(index_path) else None\n'''
          if text.count(old) != 1:
            raise SystemExit('Codex session-index helper did not match exactly once')
          text = text.replace(old, new, 1)

          old = '''  session_index_records = (\n    _codex_session_index_records() if session.source == "codex" else []\n  )\n  response = _core_bridge().render(\n    session.source, records, source_indexes, projections,\n    options={\n      "includeRolledBackTurns": _display_policy().include_rolled_back,\n    },\n    session_index_records=session_index_records,\n  )\n'''
          new = '''  supplementary_sources = {}\n  if session.source == "codex":\n    session_index_path = _codex_session_index_path()\n    if session_index_path:\n      supplementary_sources["codexSessionIndex"] = {"path": session_index_path}\n  response = _core_bridge().render(\n    session.source, records, source_indexes, projections,\n    options={\n      "includeRolledBackTurns": _display_policy().include_rolled_back,\n    },\n    supplementary_sources=supplementary_sources,\n  )\n'''
          if text.count(old) != 1:
            raise SystemExit('core transcript supplementary block did not match exactly once')
          text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8', newline='\n')
          PY

          cat > scripts/AI-transcript-core-worker.mjs <<'EOF'
          #!/usr/bin/env node

          import { createInterface } from 'node:readline';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const CORE_COMMIT = '4ee65bab8f6a4c2f9caf55f2ff342d903108f8de';

          function coreRootPath() {
            const configured = process.env.AI_CONVERSATION_CORE;
            if (configured && !configured.endsWith('.js')) return path.resolve(configured);
            return path.resolve(import.meta.dirname, '..', 'dependencies', 'AIConversationCore');
          }

          function coreEntryPath() {
            const configured = process.env.AI_CONVERSATION_CORE;
            if (configured?.endsWith('.js')) return configured;
            return path.join(coreRootPath(), 'src', 'index.js');
          }

          function verifyCorePin() {
            const configured = process.env.AI_CONVERSATION_CORE;
            if (configured?.endsWith('.js')) {
              throw new Error('AI_CONVERSATION_CORE must name the pinned AIConversationCore repository, not a JavaScript file');
            }
            let actual;
            try {
              actual = execFileSync('git', ['-C', coreRootPath(), 'rev-parse', 'HEAD'], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe']
              }).trim();
            } catch (error) {
              throw new Error(`Cannot verify AIConversationCore checkout at ${coreRootPath()}: ${error.message}`);
            }
            if (actual !== CORE_COMMIT) {
              throw new Error(`AIConversationCore commit mismatch: expected ${CORE_COMMIT}, found ${actual}`);
            }
          }

          verifyCorePin();
          const core = await import(pathToFileURL(coreEntryPath()).href);

          function eventProjection(event, projectionByIndex) {
            const inherited = event?.projection ?? {};
            const supplied = projectionByIndex.get(event.source_index) ?? {};
            const base = {
              ...inherited,
              ...supplied,
              heading_metadata: {
                ...(inherited.heading_metadata ?? {}),
                ...(supplied.heading_metadata ?? {})
              },
              colors: {
                ...(inherited.colors ?? {}),
                ...(supplied.colors ?? {})
              }
            };
            if (!Object.keys(base.heading_metadata).length) delete base.heading_metadata;
            if (!Object.keys(base.colors).length) delete base.colors;

            const relatedSources = {};
            for (const [name, source] of Object.entries(event.relationships ?? {})) {
              if (!source || typeof source !== 'object' || !Number.isInteger(source.record_index)) continue;
              const related = projectionByIndex.get(source.record_index);
              if (related) relatedSources[name] = related;
            }
            return Object.keys(relatedSources).length
              ? { ...base, related_sources: relatedSources }
              : base;
          }

          function render(request) {
            if (request?.operation === 'ping') {
              return { ok: true, core_commit: CORE_COMMIT };
            }
            if (request?.operation !== 'render') {
              throw new Error(`Unsupported operation: ${request?.operation}`);
            }
            if (!Array.isArray(request.records)) {
              throw new TypeError('render request records must be an array');
            }

            const options = {
              includeRolledBackTurns: request?.options?.includeRolledBackTurns === true
            };
            const loaded = core.loadConversationSources({
              provider: request.provider,
              primarySource: { records: request.records },
              supplementarySources: request.supplementary_sources ?? {},
              options
            });
            const projectionByIndex = new Map(
              Object.entries(request.projections ?? {}).map(([index, projection]) => [Number(index), projection])
            );
            let events = loaded.events.map(event => {
              const projection = eventProjection(event, projectionByIndex);
              return Object.keys(projection).length ? { ...event, projection } : event;
            });
            if (Array.isArray(request.source_indexes)) {
              const allowed = new Set(request.source_indexes);
              events = events.filter(event =>
                event.content_type === 'model_change' || allowed.has(event.source_index));
            }

            return {
              ok: true,
              core_commit: CORE_COMMIT,
              markdown: core.renderCanonicalMarkdown(events),
              ...(loaded.session_metadata ? { session_metadata: loaded.session_metadata } : {})
            };
          }

          const input = createInterface({ input: process.stdin, crlfDelay: Infinity });
          for await (const line of input) {
            if (!line.trim()) continue;
            try {
              process.stdout.write(`${JSON.stringify(render(JSON.parse(line)))}\n`);
            } catch (error) {
              process.stdout.write(`${JSON.stringify({
                ok: false,
                error: error instanceof Error ? error.message : String(error)
              })}\n`);
            }
          }
          EOF
          chmod +x scripts/AI-transcript-core-worker.mjs

          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/AI-transcript-core.md')
          text = path.read_text(encoding='utf-8')
          section = '''\n## Codex supplementary source ownership\n\nFor Codex, the Python caller discovers the optional `session_index.jsonl` path and passes that path to AIConversationCore. The caller does not parse or interpret the index. AIConversationCore owns reading JSONL, matching the rollout/session UUID, choosing the last valid matching title, rollback/edit semantics, model-change semantics, and revision filtering. Rolled-back history remains hidden by default; `--include-rolled-back` passes `includeRolledBackTurns=true` to the core. Recorded Codex IDE context is preserved verbatim.\n'''
          if '## Codex supplementary source ownership' not in text:
            text = text.rstrip() + '\n' + section
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          python -m py_compile scripts/AI-transcript.py scripts/test-AI-transcript-codex-revisions.py
          git diff --check
          AI_CONVERSATION_CORE="$PWD/dependencies/AIConversationCore" \
            python scripts/test-AI-transcript-codex-revisions.py

          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add dependencies/AIConversationCore scripts/AI-transcript.py \
            scripts/AI-transcript-core-worker.mjs scripts/AI-transcript-core.md
          git commit -m "feat: delegate Codex supplementary source parsing to core"
          git push origin HEAD:master
